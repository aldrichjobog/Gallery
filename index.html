<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>One Piece Gallery</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- HERO -->
    <section class="hero-section">
        <div class="overlay">
            <h1 class="display-4 text-white fw-bold">One Piece Gallery</h1>
            <p class="lead text-white">Explore the Pirates and Marines of the New World</p>
        </div>
    </section>

    <!-- MAIN CONTENT -->
    <div class="container my-5">

        <!-- NAVY MARINES -->
        <h2 class="fw-bold text-primary mb-4">Navy Marines</h2>
        <div class="row" id="marine-row"></div>

        <hr class="my-5">

        <!-- PIRATES -->
        <h2 class="fw-bold text-danger mb-4">Pirates</h2>
        <div class="row" id="pirate-row"></div>

    </div>

    <!-- WARNING -->
    <section class="warning-full bg-dark text-white py-4">
        <div class="container text-center">
            <h5 class="fw-bold">Disclaimer</h5>
            <p class="mb-0">This gallery is created for school project purposes only.</p>
            <p class="mb-0">All One Piece characters and images belong to Eiichiro Oda, Shueisha, and Toei Animation.</p>
        </div>
    </section>

    <!-- SCRIPT -->
    <script src="data.js"></script>

    <script>
        var marineRow = document.getElementById("marine-row");
        var pirateRow = document.getElementById("pirate-row");

        for (var i = 0; i < galleryItems.length; i++) {
            var item = galleryItems[i];

            var card = `
                <div class="col-md-4 col-lg-3 mb-4">
                    <div class="card my-3 shadow-sm">
                        <img src="${item.image}" class="card-img-top">
                        <div class="card-body">
                            <h5 class="card-title">${item.title}</h5>
                            <p class="card-text">${item.description}</p>
                        </div>
                    </div>
                </div>
            `;

            if (item.category === "marine") {
                marineRow.innerHTML += card;
            } else {
                pirateRow.innerHTML += card;
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
