<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One Piece Gallery</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Font for One Piece style -->
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HERO SECTION -->
  <section class="hero-section">
    <div class="overlay">
      <h1 class="display-4 text-white fw-bold">One Piece Gallery</h1>
      <p class="lead text-white">Explore the Pirates and Marines of the New World</p>
    </div>
  </section>

  <!-- MAIN GALLERY -->
  <div class="container my-5">

    <!-- NAVY MARINES -->
    <h2 class="fw-bold text-primary mb-4"><img src="images/marine-emblem.png" class="title-icon" alt="Marine"> Navy Marines</h2>
    <div class="row" id="marine-row"></div>

    <hr class="my-5">

    <!-- PIRATES -->
    <h2 class="fw-bold text-danger mb-4"><img src="images/jollyroger.png" class="title-icon" alt="Pirate"> Pirates</h2>
    <div class="row" id="pirate-row"></div>

  </div>

  <!-- DISCLAIMER -->
  <section class="warning-full bg-dark text-white py-4">
    <div class="container text-center">
      <h5 class="fw-bold">Disclaimer</h5>
      <p class="mb-0">This gallery is created for school project purposes only.</p>
      <p class="mb-0">All One Piece characters and images belong to Eiichiro Oda, Shueisha, and Toei Animation.</p>
    </div>
  </section>

  <!-- SCRIPTS -->
  <script src="data.js"></script>
  <script>
    var marineRow = document.getElementById("marine-row");
    var pirateRow = document.getElementById("pirate-row");

    for (var i = 0; i < galleryItems.length; i++) {
      var item = galleryItems[i];

      var icon = '';
      if (item.category === 'pirate') {
        icon = '<img src="images/jollyroger.png" class="icon" alt="pirate icon">';
      } else {
        icon = '<img src="images/marine-emblem.png" class="icon" alt="marine icon">';
      }

      var bounty = '';
      if (item.category === 'pirate') {
        bounty = `data-bounty="Bounty: ${item.description.split('|')[0].split(':')[1].trim()}"`;
      }

      var card = `
      <div class="col-md-4 col-lg-3 mb-4">
          <div class="card my-3 shadow-sm gallery-card ${item.category}" ${bounty}>
              ${icon}
              <div class="img-container">
                  <img src="${item.image}" class="card-img-top" alt="${item.title}">
              </div>
              <div class="card-body">
                  <h5 class="card-title">${item.title}</h5>
                  <p class="card-text">${item.description}</p>
              </div>
          </div>
      </div>
      `;

      if (item.category === "marine") {
        marineRow.innerHTML += card;
      } else {
        pirateRow.innerHTML += card;
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
