<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One Piece Gallery</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- One Piece font -->
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HERO SECTION -->
  <section class="hero-section">
    <div class="overlay">
      <h1 class="display-4 text-white fw-bold">One Piece Gallery</h1>
      <p class="lead text-white">Explore the Pirates and Marines of the New World</p>
    </div>
  </section>

  <!-- MAIN CONTENT -->
  <div class="background-theme">

    <div class="container my-5">

      <!-- MARINES -->
      <h2 class="fw-bold text-primary mb-4">
        <img src="images/marine-emblem.png" class="title-icon" alt="Marine">
        Navy Marines
      </h2>
      <div class="row" id="marine-row"></div>

      <hr class="my-5">

      <!-- PIRATES -->
      <h2 class="fw-bold text-danger mb-4">
        <img src="images/jollyroger.png" class="title-icon" alt="Pirate">
        Pirates
      </h2>
      <div class="row" id="pirate-row"></div>

    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
      <!-- Animated Waves -->
      <div class="wave" id="wave1"></div>
      <div class="wave" id="wave2"></div>
      <div class="wave" id="wave3"></div>
      <div class="wave" id="wave4"></div>

      <img src="images/jollyroger.png" alt="Jolly Roger">
      <h4>One Piece Grand Gallery</h4>
      <small>Created by Aldrich • For educational purposes only</small>
  </footer>

  <!-- Data -->
  <script src="data.js"></script>

  <!-- Render Cards -->
  <script>
    var marineRow = document.getElementById("marine-row");
    var pirateRow = document.getElementById("pirate-row");

    for (var i = 0; i < galleryItems.length; i++) {
      var item = galleryItems[i];

      var icon = item.category === "pirate"
        ? '<img src="images/jollyroger.png" class="icon">'
        : '<img src="images/marine-emblem.png" class="icon">';

      var bounty = item.category === "pirate"
        ? `data-bounty="Bounty: ${item.description.split('|')[0].split(':')[1].trim()}"`
        : "";

      var card = `
        <div class="col-md-4 col-lg-3 mb-4">
          <div class="card my-3 shadow-sm gallery-card ${item.category}" ${bounty}>
            ${icon}
            <div class="img-container">
              <img src="${item.image}" class="card-img-top" alt="${item.title}">
            </div>
            <div class="card-body">
              <h5 class="card-title">${item.title}</h5>
              <p class="card-text">${item.description}</p>
            </div>
          </div>
        </div>
      `;

      if (item.category === "marine") {
        marineRow.innerHTML += card;
      } else {
        pirateRow.innerHTML += card;
      }
    }
  </script>

</body>
</html>
